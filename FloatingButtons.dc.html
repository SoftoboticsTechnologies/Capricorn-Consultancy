<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  @keyframes capricorn-wa-pulse {
    0% { box-shadow: 0 8px 20px rgba(13,27,42,0.22), 0 0 0 0 rgba(37,211,102,0.55); }
    70% { box-shadow: 0 8px 20px rgba(13,27,42,0.22), 0 0 0 16px rgba(37,211,102,0); }
    100% { box-shadow: 0 8px 20px rgba(13,27,42,0.22), 0 0 0 0 rgba(37,211,102,0); }
  }
</style>
</helmet>
<div style="position: fixed; right: 18px; bottom: 18px; zIndex: 200; display: flex; flexDirection: column; alignItems: center; gap: 12px;">
  <sc-if value="{{ showTop }}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Go to top of page" onClick="{{ scrollTop }}" style="width: 52px; height: 52px; borderRadius: 50%; border: none; background: #1E3A8A; color: #ffffff; fontSize: 18px; cursor: pointer; display: flex; alignItems: center; justifyContent: center; boxShadow: 0 8px 20px rgba(13,27,42,0.25); transition: transform 0.2s ease, background 0.2s ease;" style-hover="background: #0D1B2A; transform: scale(1.08);">
      <i class="fa-solid fa-arrow-up"></i>
    </button>
  </sc-if>
  <a href="https://wa.me/917058220075?text=Hi%2C%20I%20would%20like%20to%20enquire%20about%20your%20services." target="_blank" rel="noopener" aria-label="Chat with Capricorn Consultancy on WhatsApp" style="width: 58px; height: 58px; borderRadius: 50%; background: #25D366; color: #ffffff; fontSize: 30px; display: flex; alignItems: center; justifyContent: center; textDecoration: none; animation: capricorn-wa-pulse 2.4s ease-out infinite; transition: transform 0.2s ease;" style-hover="transform: scale(1.08); color: #ffffff;">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:220}}">
class Component extends DCLogic {
  state = { scrolled: false };

  componentDidMount() {
    this.onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const next = y > 320;
      if (next !== this.state.scrolled) this.setState({ scrolled: next });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
  }

  renderVals() {
    return {
      showTop: this.state.scrolled,
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })
    };
  }
}
</script>
</body>
</html>
